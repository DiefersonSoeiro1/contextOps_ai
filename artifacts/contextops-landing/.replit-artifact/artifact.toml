kind = "web"
previewPath = "/"
title = "ContextOps AI - Landing Page"
version = "1.0.0"
id = "artifacts/contextops-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23584
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/contextops-landing run dev"

[services.env]
PORT = "23584"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/contextops-landing", "run", "build"]
publicDir = "artifacts/contextops-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
